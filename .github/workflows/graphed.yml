name: graphed

# The ADL-port acceptance (P1): the eight graphed queries over the committed 50k skim, pinned
# BIT FOR BIT against the committed coffea reference counts. Runs on the graphed-mvp branch only.
on:
  push:
    branches: [graphed-mvp]
  workflow_dispatch:

concurrency:
  group: graphed-${{ github.ref }}
  cancel-in-progress: true

env:
  # graphed core/frontend/numpy/awkward/debug/checkpoint/preserve are now ONE consolidated package
  # (graphed.core / graphed.awkward / graphed.checkpoint / graphed.preserve). The [preserve] extra
  # pulls awkward + correctionlib + onnx for the bundle tests; checkpoint's cloudpickle is a base dep.
  GRAPHED: "graphed[awkward,numpy,preserve] @ git+https://github.com/graphed-org/graphed@main"
  # still-separate packages (each depends on the consolidated graphed):
  EXEC: "graphed-exec-local @ git+https://github.com/graphed-org/graphed-exec-local-mvp@main"
  HISTO: "graphed-histogram @ git+https://github.com/graphed-org/graphed-histogram-mvp@main"
  UPROOT: "uproot @ git+https://github.com/graphed-org/uproot5-graphed-mvp@graphed-mvp"
  HIST: "hist @ git+https://github.com/graphed-org/hist-graphed-mvp@graphed-mvp"

jobs:
  tests:
    name: ADL acceptance ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the graphed stack + the reader/hist forks
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.EXEC }}" "${{ env.HISTO }}" \
            "${{ env.UPROOT }}" "${{ env.HIST }}"
          python -m pip install pytest vector coffea
          # coffea's resolver pulls PyPI uproot OVER the fork (the same trap hit locally):
          # the fork must win, and it satisfies coffea (uproot 5.x + the graphed additions)
          python -m pip install --force-reinstall --no-deps "${{ env.UPROOT }}"
      - name: Generate the coffea reference ON THIS PLATFORM
        # libm ULP differences across platforms can flip argmin picks between near-equidistant
        # trijet candidates (q6): bit-for-bit is a SAME-PLATFORM claim, so the reference is
        # produced here from the committed skim (no network; coffea only needed for this step)
        run: python scripts/make_reference.py
      - name: ADL acceptance vs the coffea reference
        run: python -m pytest tests -q
