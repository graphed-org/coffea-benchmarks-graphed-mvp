name: graphed

# The ADL-port acceptance (P1): the eight graphed queries over the committed 50k skim, pinned
# BIT FOR BIT against the committed coffea reference counts. Runs on the graphed-mvp branch only.
on:
  push:
    branches: [graphed-mvp]
  workflow_dispatch:

concurrency:
  group: graphed-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE: "graphed-core @ git+https://github.com/graphed-org/graphed-core-mvp@main"
  DEBUG: "graphed-debug @ git+https://github.com/graphed-org/graphed-debug-mvp@main"
  FRONTEND: "graphed @ git+https://github.com/graphed-org/graphed-mvp@main"
  NUMPY: "graphed-numpy @ git+https://github.com/graphed-org/graphed-numpy-mvp@main"
  AWKWARD: "graphed-awkward @ git+https://github.com/graphed-org/graphed-awkward-mvp@main"
  EXEC: "graphed-exec-local @ git+https://github.com/graphed-org/graphed-exec-local-mvp@main"
  HISTO: "graphed-histogram @ git+https://github.com/graphed-org/graphed-histogram-mvp@main"
  UPROOT: "uproot @ git+https://github.com/graphed-org/uproot5-graphed-mvp@graphed-mvp"
  HIST: "hist @ git+https://github.com/graphed-org/hist-graphed-mvp@graphed-mvp"

jobs:
  tests:
    name: ADL acceptance ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the graphed stack + the reader/hist forks
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.CORE }}" "${{ env.DEBUG }}" "${{ env.FRONTEND }}" \
            "${{ env.NUMPY }}" "${{ env.AWKWARD }}" "${{ env.EXEC }}" "${{ env.HISTO }}" \
            "${{ env.UPROOT }}" "${{ env.HIST }}"
          python -m pip install pytest vector
      - name: ADL acceptance vs the committed coffea reference
        run: python -m pytest tests -q
